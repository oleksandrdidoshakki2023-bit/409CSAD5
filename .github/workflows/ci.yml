name: Java CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

permissions:
  contents: read

jobs:
  build:
    name: Build and test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        run: ci.bat
        shell: cmd

      - name: Build and test (Linux and macOS)
        if: runner.os != 'Windows'
        run: bash ./ci.sh
        shell: bash

      - name: Upload JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hello-world-${{ runner.os }}
          path: target/*.jar
          if-no-files-found: error